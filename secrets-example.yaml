# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored.
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"

# 32 random bytes, base64. Generate with:
#   https://esphome.io/components/api/  -or-
#   python3 -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "REPLACE_WITH_BASE64_KEY"
ota_password: "choose-an-ota-password"

# Fallback hotspot the gateway opens when Wi-Fi is unreachable
ap_wifi_ssid: "Goodnature Gateway Fallback"
ap_wifi_password: "fallback-hotspot-password"

# Only if you uncomment manual_ip in goodnature-gateway.yaml
# static_ip: 192.168.1.50
# gateway: 192.168.1.1
# subnet: 255.255.255.0
