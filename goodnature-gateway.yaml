# Goodnature trap BLE gateway for ESP32-C6.
#
# This file is the complete gateway configuration and never needs editing
# for a normal setup. It includes two files you create from the examples:
#
#   cp settings-example.yaml settings.yaml   # tunables: names, slots, timers
#   cp secrets-example.yaml secrets.yaml     # Wi-Fi, API key, OTA password
#   esphome run goodnature-gateway.yaml
#
# It discovers Goodnature A24 / C20 traps automatically and exposes each
# one to Home Assistant as its own device (via the ESPHome integration).

external_components:
  # Local checkout (this repository)
  - source:
      type: local
      path: components
    components: [goodnature_ble]
  # Or pull straight from git and delete the local source above:
  # - source: github://kedube/esphome-goodnature-ble@main
  #   components: [goodnature_ble]

packages:
  settings: !include settings.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  area: ${device_area}
  min_version: 2025.12.0
  # Release version of this gateway firmware (x.y). Home Assistant shows it
  # as the gateway device's firmware version next to the ESPHome version,
  # and the Gateway Version text sensor below reports the same string.
  # Bump it here and tag the commit (v1.0) when cutting a release.
  project:
    name: kedube.goodnature-gateway
    version: "1.0"
  # ESPHome flashes with its own esptool step and reads upload_speed from
  # here. The serial port is not a build option (the native ESP-IDF build
  # ignores upload_port), so `make flash` passes upload_port from
  # settings.yaml as `esphome run --device`.
  platformio_options:
    upload_speed: ${upload_speed}

esp32:
  board: ${board}
  variant: esp32c6
  flash_size: ${flash_size}
  # Larger OTA app slots than ESPHome's default; see partitions.csv. Applied
  # by the next USB flash, and harmless over OTA until then.
  partitions: partitions.csv
  framework:
    type: esp-idf
    # Keep the GATT cache out of flash: traps change handles between
    # firmware versions and a stale cache breaks reads.
    sdkconfig_options:
      CONFIG_BT_GATTC_CACHE_NVS_FLASH: "n"

logger:
  level: ${log_level}
  logs:
    esp32_ble_tracker: WARN
    esp32_ble_client: WARN

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s  # keep running (and logging strikes) even if HA is away

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: ${ota_address}  # OTA / log target for `esphome run` and `make ota`
  power_save_mode: none  # BLE + Wi-Fi coexistence is happier without modem sleep
  ap:
    ssid: !secret ap_wifi_ssid
    password: !secret ap_wifi_password
  # manual_ip:
  #   static_ip: !secret static_ip
  #   gateway: !secret gateway
  #   subnet: !secret subnet

captive_portal:

# The traps are sent the current time on every connection and the lure /
# CO2 timers need a real clock.
time:
  - platform: sntp
    id: sntp_time

esp32_ble:
  max_connections: ${ble_max_connections}

esp32_ble_tracker:
  scan_parameters:
    # Active scanning fetches the scan response, where some traps put
    # their "GN" name. Continuous scanning keeps us listening for chirps.
    active: true
    continuous: true
    interval: 320ms
    window: 120ms

goodnature_ble:
  time_id: sntp_time
  max_traps: ${max_traps}
  slot_name_prefix: ${slot_name_prefix}
  poll_interval: ${poll_interval}
  write_time_on_connect: ${write_time_on_connect}
  lure_life_days: ${lure_life_days}
  co2_capacity: ${co2_capacity}
  co2_low_threshold: ${co2_low_threshold}
  offline_timeout_a24: ${offline_timeout_a24}
  offline_timeout_c20: ${offline_timeout_c20}
  discovery: ${discovery}
  auto_acknowledge: ${auto_acknowledge}
  a24_battery_empty_raw: ${a24_battery_empty_raw}
  a24_battery_full_raw: ${a24_battery_full_raw}
  a24_battery_low_percent: ${a24_battery_low_percent}

# Optional: also act as a Bluetooth proxy for Home Assistant. Costs one
# connection slot and some radio time.
# bluetooth_proxy:
#   active: false

# Gateway diagnostics
sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: template
    name: Free Heap
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    unit_of_measurement: B
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
  - platform: version
    name: ESPHome Version
    entity_category: diagnostic
  - platform: template
    name: Gateway Version
    entity_category: diagnostic
    icon: mdi:tag
    lambda: return {ESPHOME_PROJECT_VERSION};
    update_interval: never

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
